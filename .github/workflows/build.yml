name: Build and Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_notes:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      RELEASE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 3.8.1 or v3.8.1'
        required: true
        type: string
      release_notes:
        description: 'Release notes in Markdown'
        required: true
        type: string
      commit_sha:
        description: 'Exact 40-character commit SHA to release (defaults to the workflow dispatch commit)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'kikoflu-release' || format('kikoflu-build-stable-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      suffix: ${{ steps.version.outputs.suffix }}
      commit_sha: ${{ steps.resolve_commit.outputs.commit_sha }}
    steps:
      - name: Validate selected release commit
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::commit_sha must be a full 40-character commit SHA.'
            exit 1
          fi
          if [ -z "$INPUT_COMMIT_SHA" ]; then
            echo "Using workflow dispatch commit: $WORKFLOW_SHA"
          else
            echo "Using selected release commit: $INPUT_COMMIT_SHA"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Verify selected release source configuration
        run: |
          set -euo pipefail
          if [[ ! -f scripts/ci/validate_release_source.py ]]; then
            echo '::error::Selected commit predates the required release configuration. Choose a commit that includes the new release configuration.'
            exit 1
          fi
          python3 scripts/ci/validate_release_source.py full

      - name: Resolve selected release commit
        id: resolve_commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          {
            echo '### Release commit'
            echo "- Workflow event SHA (github.sha): \`$GITHUB_SHA\`"
            echo "- Selected release commit: \`$commit_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 3.8.1."
            exit 1
          fi

          tag="v${version}"
          suffix="${version//./}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new version."
            exit 1
          fi

          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists. Choose a new version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Building release $tag with filename suffix $suffix"

  native-audio-android:
    name: Build Android Native Audio Libraries
    needs: prepare
    uses: ./.github/workflows/native_audio.yml
    with:
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      android_only: true
      android_all_abis: true

  native-audio-windows:
    name: Build Windows Native Audio Libraries
    needs: prepare
    uses: ./.github/workflows/native_audio.yml
    with:
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      windows_only: true

  native-audio-darwin:
    name: Build Darwin Native Audio Libraries
    needs: prepare
    uses: ./.github/workflows/native_audio_darwin.yml
    with:
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}

  android:
    name: Android Build
    needs: [prepare, native-audio-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Prepare Android Signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required Android signing secret $secret_name is missing."
              exit 1
            fi
          done

          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          if [ ! -s android/app/release-key.jks ]; then
            echo "::error::Decoded Android release keystore is empty."
            exit 1
          fi
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ runner.arch }}-java-17-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}

      - name: Download Android libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-android
          path: build/native-audio/android-output

      - name: Get Dependencies
        run: flutter pub get

      - name: Read Android base version code
        run: |
          set -euo pipefail
          flutter build apk --config-only --no-pub
          base_code="$(sed -n 's/^flutter\.versionCode=//p' android/local.properties | tail -n 1)"
          base_code="${base_code:-1}"
          if [[ ! "$base_code" =~ ^[0-9]+$ ]]; then
            echo '::error::Flutter did not write a valid base versionCode to android/local.properties.'
            exit 1
          fi
          echo "ANDROID_BASE_VERSION_CODE=$base_code" >> "$GITHUB_ENV"

      - name: Build Android APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/Iroru-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"

      - name: Verify Android Package Compatibility
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
          EXPECTED_CERT_SHA256: 8d432df267b5eb175c2f806381c44d7b4bf657145af792ace223af34e340f740
        run: |
          set -euo pipefail

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          arm64_apk="dist/Iroru-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"

          check_native_libraries() {
            local apk=$1
            local entries
            entries="$(unzip -Z1 "$apk" | grep '^lib/' || true)"
            for library in libmpv.so libmediakitandroidhelper.so libc++_shared.so; do
              if ! grep -Fxq "lib/arm64-v8a/$library" <<< "$entries"; then
                echo "::error::Missing lib/arm64-v8a/$library in $apk."
                return 1
              fi
            done
            abis="$(sed -nE 's#^lib/([^/]+)/.*#\1#p' <<< "$entries" | sort -u)"
            if [ "$abis" != 'arm64-v8a' ]; then
              echo "::error::Expected an arm64-only APK, found ABI entries: $abis"
              return 1
            fi
          }

          check_native_libraries "$arm64_apk"

          for tool in "$aapt" "$apksigner"; do
            if [ ! -x "$tool" ]; then
              echo "::error::Required Android build tool not found: $tool"
              exit 1
            fi
          done

          arm64_badging="$("$aapt" dump badging "$arm64_apk" | sed -n '1p')"
          arm64_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$arm64_badging")"

          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$arm64_badging")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$arm64_badging")"
          if [ "$package_name" != "com.meteor.kikoeruflutter" ] || [ "$version_name" != "$EXPECTED_VERSION" ]; then
            echo "::error::Unexpected Android package metadata: $arm64_badging"
            exit 1
          fi

          if [ "$arm64_code" -ne $((ANDROID_BASE_VERSION_CODE + 2000)) ]; then
            echo "::error::arm64 versionCode $arm64_code does not preserve the legacy split offset from $ANDROID_BASE_VERSION_CODE."
            exit 1
          fi

          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "::error::Android release signing was not configured."
            exit 1
          fi

          cert_output="$("$apksigner" verify --print-certs "$arm64_apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [ -z "$actual_cert" ]; then
            echo "::error::Unable to read the Android signing certificate for $arm64_apk."
            printf '%s\n' "$cert_output" >&2
            exit 1
          fi
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected Android signing certificate for $arm64_apk: $actual_cert"
            exit 1
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-android
          path: dist/*
          if-no-files-found: error

  android-verify:
    name: Android x86_64 Emulator Verification
    needs: [prepare, native-audio-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download Android libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-android
          path: build/native-audio/android-output

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ runner.arch }}-java-17-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}

      - name: Get Dependencies
        run: flutter pub get

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify packaged Android audio effects
        id: android-emulator-tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            bash scripts/ci/run_android_emulator_test.sh "$RUNNER_TEMP/android-emulator-diagnostics" -- flutter test --no-pub -d emulator-5554 --dart-define=KIKOFLU_PERFORMANCE=true integration_test/android_audio_verification.dart

      - name: Upload Android emulator diagnostics
        if: ${{ always() && steps.android-emulator-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-diagnostics
          path: ${{ runner.temp }}/android-emulator-diagnostics/
          if-no-files-found: warn

  windows:
    name: Windows Build
    needs: [prepare, native-audio-windows]
    # windows-latest currently ships newer VS/CMake versions that break
    # older native Flutter plugins used by this project.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Download Windows libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-windows
          path: build/native-audio/windows-output

      - name: Set Application Version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          $content = [Regex]::Replace($content, '(?m)^version:\s+.*$', 'version: ${{ needs.prepare.outputs.version }}', 1)
          Set-Content -Path pubspec.yaml -Value $content -NoNewline

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Windows native audio playback
        shell: pwsh
        run: |
          $env:KIKOFLU_AUDIO_LIBMPV = Join-Path $env:GITHUB_WORKSPACE 'build\native-audio\windows-output\mpv-dev\libmpv-2.dll'
          flutter test --no-pub test/audio_effects_service_native_host_test.dart --plain-name 'service updates only its own native audio and survives stop recreation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production audio effects
        shell: pwsh
        run: |
          flutter test --no-pub -d windows integration_test/audio_effects_production_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub -d windows integration_test/audio_backend_native_contract_test.dart --dart-define=KIKOFLU_PERFORMANCE=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc /DMyAppVersion="${{ needs.prepare.outputs.version }}" installer_script.iss
          Copy-Item -Path 'Output/Iroru-windows-setup.exe' -Destination "dist/Iroru-windows-setup_${{ needs.prepare.outputs.suffix }}.exe"

      # Keep the legacy archive implementation and unsigned Windows outputs.
      - name: Create Windows Portable Archive
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'Iroru-windows.zip'
          directory: 'build/windows/x64/runner/Release'

      - name: Rename Windows Portable Archive
        shell: pwsh
        run: |
          Move-Item -Path 'build/windows/x64/runner/Release/Iroru-windows.zip' -Destination "dist/Iroru-windows_${{ needs.prepare.outputs.suffix }}.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-windows
          path: dist/*
          if-no-files-found: error

  ios-verify:
    name: iOS Simulator Verification
    needs: [prepare, native-audio-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Download custom iOS libmpv archive
        uses: actions/download-artifact@v6
        with:
          name: native-audio-darwin-ios
          path: build/native-audio/darwin-output

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Get Dependencies
        run: flutter pub get

      - name: Verify iOS native audio playback
        timeout-minutes: 35
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, items in devices.items() if ".iOS-" in runtime for device in items if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          trap 'xcrun simctl shutdown "$simulator" || true' EXIT
          xcrun simctl bootstatus "$simulator" -b
          flutter test --no-pub -d "$simulator" integration_test/audio_apple_playback_test.dart
          flutter test --no-pub -d "$simulator" integration_test/audio_effects_production_test.dart

  ios-build:
    name: iOS Build (Unsigned)
    needs: [prepare, native-audio-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Download custom iOS libmpv archive
        uses: actions/download-artifact@v6
        with:
          name: native-audio-darwin-ios
          path: build/native-audio/darwin-output

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          (cd build && zip -qr \
            "$GITHUB_WORKSPACE/dist/Iroru-ios-unsigned_${{ needs.prepare.outputs.suffix }}.ipa" \
            Payload)

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-ios
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS Build
    needs: [prepare, native-audio-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Download custom macOS libmpv archive
        uses: actions/download-artifact@v6
        with:
          name: native-audio-darwin-macos
          path: build/native-audio/darwin-output

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Get Dependencies
        run: flutter pub get

      - name: Verify macOS native audio playback
        run: |
          flutter test --no-pub -d macos integration_test/audio_apple_playback_test.dart
          flutter test --no-pub -d macos integration_test/audio_effects_production_test.dart

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Verify macOS Release Architecture
        run: |
          set -euo pipefail
          executable=build/macos/Build/Products/Release/Iroru.app/Contents/MacOS/Iroru
          architectures="$(lipo -archs "$executable")"
          if [[ "$architectures" != arm64 ]]; then
            echo "::error::Expected Iroru.app to contain only arm64, found: $architectures"
            exit 1
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          rm -rf build/dmg dist
          mkdir -p build/dmg dist
          cp -R build/macos/Build/Products/Release/Iroru.app build/dmg/
          hdiutil create -volname "Iroru" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "dist/Iroru-macos_${{ needs.prepare.outputs.suffix }}.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64 Build
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set Application Version
        run: |
          sed -i.bak -E 's/^version: .*/version: ${{ needs.prepare.outputs.version }}/' pubspec.yaml
          rm pubspec.yaml.bak

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            pax-utils patchelf binutils \
            libsqlite3-dev libssl-dev libass-dev libepoxy-dev libpulse-dev libasound2-dev \
            libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxinerama-dev libxss-dev \
            libxpresent-dev libxv-dev libwayland-dev wayland-protocols nasm python3-pip xvfb

      - name: Test Linux bundle dependency checks
        run: bash linux/test_bundle_check.sh

      - name: Cache or build shared Linux native audio
        uses: ./.github/actions/linux-native-audio-cache

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true
          pub-cache: true


      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Verify Linux Release Bundle
        run: bash linux/check_linux_bundle.sh build/linux/x64/release/bundle

      - name: Verify packaged Linux PCM contracts
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          flutter test --no-pub test/audio_effects_graph_test.dart
          export LD_LIBRARY_PATH="$bundle/lib"
          python3 tool/audio_effects/production_contracts.py --libmpv "$bundle/lib/libmpv.so" --graphs build/audio-effects-contract/graphs.json --variant customLibrary --output build/native-audio/linux-output/production-pcm.json
          python3 tool/audio_effects/binaural_contracts.py --libmpv "$bundle/lib/libmpv.so" --graphs build/audio-effects-contract/graphs.json --variant customLibrary --output build/native-audio/linux-output/binaural-pcm.json
          python3 tool/audio_effects/control_cache_contracts.py --libmpv "$bundle/lib/libmpv.so" --output build/native-audio/linux-output/control-cache.json

      - name: Verify packaged Linux audio effects
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          debug_bundle="$GITHUB_WORKSPACE/build/linux/x64/debug/bundle"
          timeout 5m xvfb-run -a flutter test --no-pub -d linux integration_test/audio_effects_production_test.dart --dart-define="KIKOFLU_AUDIO_LIBMPV=$debug_bundle/lib/libmpv.so"

      - name: Upload Linux native audio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-audio-linux-x64-evidence
          path: |
            build/native-audio/linux-output/*.json
            build/native-audio/linux-output/source-provenance.txt
          if-no-files-found: warn

      - name: Create Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/linux/x64/release/bundle && tar -czf \
            "$GITHUB_WORKSPACE/dist/Iroru-linux-x64_${{ needs.prepare.outputs.suffix }}.tar.gz" .)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-linux-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - android
      - android-verify
      - windows
      - ios-verify
      - ios-build
      - macos
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Verify and publish release atomically
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          expected=(
            "Iroru-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"
            "Iroru-ios-unsigned_${{ needs.prepare.outputs.suffix }}.ipa"
            "Iroru-linux-x64_${{ needs.prepare.outputs.suffix }}.tar.gz"
            "Iroru-macos_${{ needs.prepare.outputs.suffix }}.dmg"
            "Iroru-windows-setup_${{ needs.prepare.outputs.suffix }}.exe"
            "Iroru-windows_${{ needs.prepare.outputs.suffix }}.zip"
          )

          assets=()
          for asset in "${expected[@]}"; do
            path="release-assets/$asset"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            fi
            assets+=("$path")
          done

          release_id=""
          release_tag=""
          draft_created=false
          cleanup_draft() {
            status="$1"
            trap - ERR INT TERM
            if [ "$draft_created" = "true" ] && [ -n "$release_id" ]; then
              echo "Cleaning up incomplete draft release $TAG (id $release_id)"
              gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}" || true
              if [ "$release_tag" = "$TAG" ] && gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
                gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" || true
              fi
            fi
            exit "$status"
          }
          trap 'cleanup_draft $?' ERR
          trap 'cleanup_draft 130' INT
          trap 'cleanup_draft 143' TERM

          release_json="$(gh api --method POST "repos/${GH_REPO}/releases" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${RELEASE_COMMIT}" \
            -f "name=${TAG}" \
            -f "body=${RELEASE_NOTES}" \
            -F 'draft=true' \
            -F 'prerelease=false')"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          release_tag="$(jq -r '.tag_name // empty' <<< "$release_json")"
          if [ -z "$release_id" ]; then
            echo "::error::GitHub did not return a usable draft release id."
            printf '%s\n' "$release_json"
            exit 1
          fi
          draft_created=true

          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            for attempt in 1 2 3; do
              echo "Uploading $asset_name (attempt $attempt/3)"
              # A failed upload can leave a same-name starter asset in this draft.
              if gh release upload "$TAG" "$asset" --repo "$GH_REPO" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to upload $asset_name after 3 attempts."
                false
              fi
              sleep $((attempt * 5))
            done
          done

          remote_assets="$(gh api "repos/${GH_REPO}/releases/${release_id}" \
            --jq '.assets[] | [.name, .size, .state] | @tsv')"
          mapfile -t uploaded < <(
            printf '%s\n' "$remote_assets" |
              awk -F '\t' '$2 > 0 && $3 == "uploaded" { print $1 }' |
              sort
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if [ "${#uploaded[@]}" -ne "${#expected_sorted[@]}" ]; then
            echo "::error::Draft release contains an unexpected number of complete assets."
            printf 'Expected: %s\n' "${expected_sorted[*]}"
            printf 'Uploaded: %s\n' "${uploaded[*]}"
            false
          fi
          for index in "${!expected_sorted[@]}"; do
            if [ "${uploaded[$index]}" != "${expected_sorted[$index]}" ]; then
              echo "::error::Draft release assets do not match the expected set."
              printf 'Expected: %s\n' "${expected_sorted[*]}"
              printf 'Uploaded: %s\n' "${uploaded[*]}"
              false
            fi
          done

          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F 'draft=false' \
            -f 'make_latest=true' >/dev/null
          draft_created=false
          trap - ERR INT TERM
