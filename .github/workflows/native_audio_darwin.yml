name: Native Audio Libraries (Darwin)

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA to build (defaults to the workflow dispatch commit)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build iOS and macOS libmpv frameworks
    runs-on: macos-15
    steps:
      - name: Validate selected commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha != '' }}
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$INPUT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::commit_sha must be a full 40-character commit SHA.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.5'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.21.0'

      - name: Install pinned build tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/darwin-audio-tools"
          "$RUNNER_TEMP/darwin-audio-tools/bin/python" -m pip install \
            --requirement scripts/native_audio/darwin-requirements.txt
          echo "$RUNNER_TEMP/darwin-audio-tools/bin" >> "$GITHUB_PATH"

      - name: Verify source patches
        working-directory: scripts/native_audio
        run: >-
          python3 -m unittest
          test_darwin_native.LibpngMacOSPatchTests
          test_darwin_native.DarwinSdkPathTests
          test_darwin_native.DarwinRecipePatchTests.test_native_source_patches_apply_at_the_pinned_source_locations

      - name: Build and validate custom frameworks
        run: bash scripts/native_audio/build_darwin.sh

      - name: Upload iOS libmpv archive
        uses: actions/upload-artifact@v6
        with:
          name: native-audio-darwin-ios
          path: |
            build/native-audio/darwin-output/libmpv-xcframeworks_v0.6.0_ios-universal-video-default.tar.gz
            build/native-audio/darwin-output/source-provenance.txt
          if-no-files-found: error

      - name: Upload macOS libmpv archive
        uses: actions/upload-artifact@v6
        with:
          name: native-audio-darwin-macos
          path: |
            build/native-audio/darwin-output/libmpv-xcframeworks_v0.6.0_macos-universal-video-default.tar.gz
            build/native-audio/darwin-output/source-provenance.txt
          if-no-files-found: error
