name: Build test

on:
  push:
  
  workflow_dispatch:
    inputs:
      native_audio_only:
        description: 'Build and verify native audio libraries'
        type: boolean
        default: false
      native_audio_all_abis:
        description: 'Build all Android ABIs in the native audio task'
        type: boolean
        default: false
      native_audio_windows_only:
        description: 'Retry only the Windows native audio build'
        type: boolean
        default: false
      native_audio_android_only:
        description: 'Run Android builds and checks, or only its native libraries with native_audio_only'
        type: boolean
        default: false
      native_audio_darwin_only:
        description: 'Build only the custom iOS and macOS native audio libraries'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-audio:
    name: Native Audio Libraries
    if: ${{ !inputs.native_audio_darwin_only && (inputs.native_audio_only || !inputs.native_audio_android_only) }}
    uses: ./.github/workflows/native_audio.yml
    with:
      commit_sha: ${{ github.sha }}
      windows_only: ${{ !inputs.native_audio_only || inputs.native_audio_windows_only == true }}
      android_only: ${{ inputs.native_audio_android_only == true }}
      android_all_abis: ${{ inputs.native_audio_all_abis == true }}

  native-audio-android:
    name: Android Native Audio Libraries
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only }}
    uses: ./.github/workflows/native_audio.yml
    with:
      commit_sha: ${{ github.sha }}
      android_only: true
      android_all_abis: true

  native-audio-darwin:
    name: Darwin Native Audio Libraries
    if: ${{ !inputs.native_audio_android_only && (!inputs.native_audio_only || inputs.native_audio_darwin_only) }}
    uses: ./.github/workflows/native_audio_darwin.yml
    with:
      commit_sha: ${{ github.sha }}

  validate-native-audio-windows:
    name: Validate Windows Audio Effects
    if: ${{ inputs.native_audio_only && !inputs.native_audio_android_only && !inputs.native_audio_darwin_only }}
    needs: native-audio
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: native-audio-windows
          path: build/native-audio/windows-output
      - name: Verify actual effect output
        run: python tool/audio_effects/validate.py --libmpv "$env:GITHUB_WORKSPACE\build\native-audio\windows-output\mpv-dev\libmpv-2.dll" --output "$env:RUNNER_TEMP\audio-effects-validation.json"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify native Player integration
        run: flutter test -d windows integration_test/audio_effects_native_test.dart --dart-define="KIKOFLU_AUDIO_LIBMPV=$env:GITHUB_WORKSPACE\build\native-audio\windows-output\mpv-dev\libmpv-2.dll"
      - name: Verify actual audio adapter contracts
        run: |
          flutter test -d windows integration_test/audio_backend_native_contract_test.dart --dart-define=KIKOFLU_PERFORMANCE=true --dart-define="KIKOFLU_AUDIO_LIBMPV=$env:GITHUB_WORKSPACE\build\native-audio\windows-output\mpv-dev\libmpv-2.dll" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\audio-backend-contract.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload effect evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-audio-windows-effects
          path: |
            ${{ runner.temp }}\audio-effects-validation.json
            ${{ runner.temp }}\audio-backend-contract.log
          if-no-files-found: warn

  quality:
    name: Analyze and Test
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test release upload recovery
        run: python3 scripts/test_release_uploads.py

      - name: Test Gradle wrapper download recovery
        run: python3 scripts/test_gradle_download_retry.py

      - name: Test Android signing certificate consistency
        run: python3 scripts/test_android_signing.py

      - name: Test release metadata
        run: python3 scripts/test_release_metadata.py

      - name: Test audio effects probe
        run: python3 scripts/test_audio_effects_probe.py

      - name: Test shared native source contracts
        run: python3 scripts/native_audio/test_common_native.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test streaming ZIP extraction
        run: dart --enable-asserts run scripts/test_streaming_zip_extractor.dart

      - name: Test
        run: flutter test --exclude-tags external

      - name: Upload Golden Failure Images
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: golden-failures
          path: test/**/failures/**
          if-no-files-found: ignore

  android:
    name: Android Build
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only }}
    needs: native-audio-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Android libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-android
          path: build/native-audio/android-output

      - name: Prepare Android Signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret missing; skipping signing setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk dist/Iroru-android-universe-test.apk
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Iroru-android-arm64-v8a-test.apk

      - name: Verify Android Package Compatibility
        env:
          SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
          EXPECTED_CERT_SHA256: 8d432df267b5eb175c2f806381c44d7b4bf657145af792ace223af34e340f740
        run: |
          set -euo pipefail

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          universal_apk="dist/Iroru-android-universe-test.apk"
          arm64_apk="dist/Iroru-android-arm64-v8a-test.apk"

          check_native_libraries() {
            local apk=$1
            shift
            local entries
            entries="$(unzip -Z1 "$apk" | grep '^lib/' || true)"
            printf 'Native libraries in %s:\n%s\n' "$apk" "${entries:-<none>}"
            for abi in "$@"; do
              for library in libmpv.so libmediakitandroidhelper.so libc++_shared.so; do
                if ! grep -Fxq "lib/$abi/$library" <<< "$entries"; then
                  echo "::error::Missing lib/$abi/$library in $apk."
                  return 1
                fi
              done
            done
          }

          check_native_libraries "$universal_apk" armeabi-v7a arm64-v8a x86_64
          check_native_libraries "$arm64_apk" arm64-v8a

          for tool in "$aapt" "$apksigner"; do
            if [ ! -x "$tool" ]; then
              echo "::error::Required Android build tool not found: $tool"
              exit 1
            fi
          done

          universal_badging="$("$aapt" dump badging "$universal_apk" | sed -n '1p')"
          arm64_badging="$("$aapt" dump badging "$arm64_apk" | sed -n '1p')"
          universal_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$universal_badging")"
          arm64_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$arm64_badging")"

          for badging in "$universal_badging" "$arm64_badging"; do
            package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
            if [ "$package_name" != "com.meteor.kikoeruflutter" ]; then
              echo "::error::Unexpected Android package metadata: $badging"
              exit 1
            fi
          done

          if [ "$arm64_code" -ne $((universal_code + 2000)) ]; then
            echo "::error::arm64 versionCode $arm64_code does not preserve the legacy split offset from $universal_code."
            exit 1
          fi

          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            for apk in "$universal_apk" "$arm64_apk"; do
              cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
              actual_cert="$(
                printf '%s\n' "$cert_output" |
                  sed -nE '/certificate SHA-256 digest:/I {
                    s/.*certificate SHA-256 digest:[[:space:]]*//I
                    p
                    q
                  }' |
                  tr -d '[:space:]:' |
                  tr '[:upper:]' '[:lower:]'
              )"
              if [ -z "$actual_cert" ]; then
                echo "::error::Unable to read the Android signing certificate for $apk."
                printf '%s\n' "$cert_output" >&2
                exit 1
              fi
              if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
                echo "::error::Unexpected Android signing certificate for $apk: $actual_cert"
                exit 1
              fi
            done
          fi

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify packaged Android audio effects
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            flutter test --no-pub -d emulator-5554
            --dart-define=KIKOFLU_PERFORMANCE=true
            integration_test/android_audio_verification.dart

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-android
          path: dist/*
          if-no-files-found: error

  ios-verify:
    name: iOS Simulator Verification
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    needs: native-audio-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download custom iOS libmpv archive
        uses: actions/download-artifact@v6
        with:
          name: native-audio-darwin-ios
          path: build/native-audio/darwin-output

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify iOS native audio playback
        timeout-minutes: 35
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, items in devices.items() if ".iOS-" in runtime for device in items if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          log=$(mktemp)
          trap 'xcrun simctl shutdown "$simulator" || true; rm -f "$log"' EXIT
          xcrun simctl bootstatus "$simulator" -b
          for test_file in integration_test/audio_apple_playback_test.dart integration_test/audio_effects_production_test.dart; do
            if flutter test --no-pub -d "$simulator" "$test_file" 2>&1 | tee "$log"; then
              continue
            else
              status=$?
            fi
            grep -Fq 'Xcode build is missing expected TARGET_BUILD_DIR build setting.' "$log" || exit "$status"
            printf 'Retrying %s after Flutter could not read TARGET_BUILD_DIR.\n' "$test_file"
            flutter --verbose test --no-pub -d "$simulator" "$test_file"
          done

  ios-build:
    name: iOS IPA Build
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    needs: native-audio-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download custom iOS libmpv archive
        uses: actions/download-artifact@v6
        with:
          name: native-audio-darwin-ios
          path: build/native-audio/darwin-output

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          (cd build && zip -qr "$GITHUB_WORKSPACE/dist/Iroru-ios-unsigned-test.ipa" Payload)

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-ios
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS Build (Unsigned)
    if: ${{ always() && !cancelled() && !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    needs: [ios-verify, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check iOS verification and build results
        env:
          IOS_BUILD_RESULT: ${{ needs.ios-build.result }}
          IOS_VERIFY_RESULT: ${{ needs.ios-verify.result }}
        run: |
          test "$IOS_VERIFY_RESULT" = success
          test "$IOS_BUILD_RESULT" = success

  macos:
    name: macOS Build
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    needs: native-audio-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download custom macOS libmpv archive
        uses: actions/download-artifact@v6
        with:
          name: native-audio-darwin-macos
          path: build/native-audio/darwin-output

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify macOS native audio playback
        run: |
          flutter test --no-pub -d macos integration_test/audio_apple_playback_test.dart
          flutter test --no-pub -d macos integration_test/audio_effects_production_test.dart

      - name: Capture macOS crash diagnostics
        if: failure()
        run: |
          log show --last 10m --style compact --predicate 'process == "Iroru" OR process == "ReportCrash"' | tail -n 500 || true
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -type f \( -name 'Iroru*.ips' -o -name 'Iroru*.crash' \) -mmin -20 -print -exec cat {} \;
          fi

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Verify macOS Release Architecture
        run: |
          set -euo pipefail
          executable=build/macos/Build/Products/Release/Iroru.app/Contents/MacOS/Iroru
          architectures="$(lipo -archs "$executable")"
          if [[ "$architectures" != arm64 ]]; then
            echo "::error::Expected Iroru.app to contain only arm64, found: $architectures"
            exit 1
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          rm -rf build/dmg dist
          mkdir -p build/dmg dist
          cp -R build/macos/Build/Products/Release/Iroru.app build/dmg/
          hdiutil create -volname "Iroru" -srcfolder build/dmg \
            -ov -format UDZO dist/Iroru-macos-test.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows Build
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    needs: native-audio
    # Keep this pinned for native plugin compatibility.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows libmpv artifacts
        uses: actions/download-artifact@v6
        with:
          name: native-audio-windows
          path: build/native-audio/windows-output

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Windows native audio playback
        shell: pwsh
        run: |
          $env:KIKOFLU_AUDIO_LIBMPV = Join-Path $env:GITHUB_WORKSPACE 'build\native-audio\windows-output\mpv-dev\libmpv-2.dll'
          flutter test --no-pub test/audio_effects_service_native_host_test.dart --plain-name 'service updates only its own native audio and survives stop recreation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production audio effects
        shell: pwsh
        run: |
          flutter test --no-pub -d windows integration_test/audio_effects_production_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub -d windows integration_test/audio_backend_native_contract_test.dart --dart-define=KIKOFLU_PERFORMANCE=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc installer_script.iss
          Copy-Item -Path 'Output/Iroru-windows-setup.exe' -Destination 'dist/Iroru-windows-setup-test.exe'

      - name: Create Windows Portable Archive
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'Iroru-windows.zip'
          directory: 'build/windows/x64/runner/Release'

      - name: Rename Windows Portable Archive
        shell: pwsh
        run: |
          Move-Item -Path 'build/windows/x64/runner/Release/Iroru-windows.zip' -Destination 'dist/Iroru-windows-test.zip'

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64 Build
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Dependencies
        timeout-minutes: 8
        run: |
          # Start with Ubuntu's HTTPS mirrors to avoid Azure mirror DNS failures.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Languages=none update --error-on=any
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            pax-utils patchelf binutils libsqlite3-dev libssl-dev libass-dev libepoxy-dev libpulse-dev libasound2-dev \
            libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxinerama-dev libxss-dev \
            libxpresent-dev libxv-dev libwayland-dev wayland-protocols nasm python3-pip xvfb

      - name: Test Linux bundle dependency checks
        run: bash linux/test_bundle_check.sh

      - name: Build shared Linux native audio
        run: |
          set -euo pipefail
          python3 -m pip install --user --requirement scripts/native_audio/requirements.txt
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/native_audio/build_linux.sh
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build/native-audio/linux-output/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/native-audio/linux-output/lib" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Verify Linux Release Bundle
        run: bash linux/check_linux_bundle.sh build/linux/x64/release/bundle

      - name: Verify packaged Linux PCM contracts
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          flutter test --no-pub test/audio_effects_graph_test.dart
          export LD_LIBRARY_PATH="$bundle/lib"
          python3 tool/audio_effects/production_contracts.py --libmpv "$bundle/lib/libmpv.so" --graphs build/audio-effects-contract/graphs.json --variant customLibrary --output build/native-audio/linux-output/production-pcm.json
          python3 tool/audio_effects/binaural_contracts.py --libmpv "$bundle/lib/libmpv.so" --graphs build/audio-effects-contract/graphs.json --variant customLibrary --output build/native-audio/linux-output/binaural-pcm.json
          python3 tool/audio_effects/control_cache_contracts.py --libmpv "$bundle/lib/libmpv.so" --output build/native-audio/linux-output/control-cache.json

      - name: Verify packaged Linux audio effects
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          debug_bundle="$GITHUB_WORKSPACE/build/linux/x64/debug/bundle"
          timeout 5m xvfb-run -a flutter test --no-pub -d linux integration_test/audio_effects_production_test.dart --dart-define="KIKOFLU_AUDIO_LIBMPV=$debug_bundle/lib/libmpv.so"

      - name: Upload Linux native audio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-audio-linux-x64-evidence
          path: |
            build/native-audio/linux-output/*.json
            build/native-audio/linux-output/source-provenance.txt
          if-no-files-found: warn

      - name: Create Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/linux/x64/release/bundle && tar -czf "$GITHUB_WORKSPACE/dist/Iroru-linux-x64-test.tar.gz" .)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-linux-x64
          path: dist/*
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 Build
    if: ${{ !inputs.native_audio_only && !inputs.native_audio_darwin_only && !inputs.native_audio_android_only }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git unzip xz-utils \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            pax-utils patchelf binutils libsqlite3-dev libssl-dev libass-dev libepoxy-dev libpulse-dev libasound2-dev \
            libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxinerama-dev libxss-dev \
            libxpresent-dev libxv-dev libwayland-dev wayland-protocols nasm python3-pip xvfb

      - name: Test Linux bundle dependency checks
        run: bash linux/test_bundle_check.sh

      - name: Build shared Linux native audio
        run: |
          set -euo pipefail
          python3 -m pip install --user --requirement scripts/native_audio/requirements.txt
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/native_audio/build_linux.sh
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build/native-audio/linux-output/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/native-audio/linux-output/lib" >> "$GITHUB_ENV"

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.44.7 "$RUNNER_TEMP/flutter" --depth 1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux ARM64 Release
        env:
          CC: clang
          CXX: clang++
          CMAKE_BUILD_PARALLEL_LEVEL: '1'
          MAKEFLAGS: '-j1'
        run: flutter build linux --release --verbose

      - name: Verify Linux ARM64 Release Bundle
        run: bash linux/check_linux_bundle.sh build/linux/arm64/release/bundle

      - name: Verify packaged Linux PCM contracts
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/build/linux/arm64/release/bundle"
          flutter test --no-pub test/audio_effects_graph_test.dart
          export LD_LIBRARY_PATH="$bundle/lib"
          python3 tool/audio_effects/production_contracts.py --libmpv "$bundle/lib/libmpv.so" --graphs build/audio-effects-contract/graphs.json --variant customLibrary --output build/native-audio/linux-output/production-pcm.json
          python3 tool/audio_effects/binaural_contracts.py --libmpv "$bundle/lib/libmpv.so" --graphs build/audio-effects-contract/graphs.json --variant customLibrary --output build/native-audio/linux-output/binaural-pcm.json
          python3 tool/audio_effects/control_cache_contracts.py --libmpv "$bundle/lib/libmpv.so" --output build/native-audio/linux-output/control-cache.json

      - name: Verify packaged Linux audio effects
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          debug_bundle="$GITHUB_WORKSPACE/build/linux/arm64/debug/bundle"
          timeout 5m xvfb-run -a flutter test --no-pub -d linux integration_test/audio_effects_production_test.dart --dart-define="KIKOFLU_AUDIO_LIBMPV=$debug_bundle/lib/libmpv.so"

      - name: Upload Linux native audio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-audio-linux-arm64-evidence
          path: |
            build/native-audio/linux-output/*.json
            build/native-audio/linux-output/source-provenance.txt
          if-no-files-found: warn

      - name: Create Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/linux/arm64/release/bundle && tar -czf "$GITHUB_WORKSPACE/dist/Iroru-linux-arm64-test.tar.gz" .)

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: test-assets-linux-arm64
          path: dist/*
          if-no-files-found: error
